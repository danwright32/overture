name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

  swift-tests:
    runs-on: [self-hosted, macOS, overture-mac]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - run: cd "${{ github.workspace }}/mac" && xcodegen generate

      - run: "${{ github.workspace }}/mac/scripts/run-tests-locked.sh"
