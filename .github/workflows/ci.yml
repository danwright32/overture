name: CI

on:
  pull_request:

# There is deliberately NO push trigger, and `src/lib/ciWorkflow.test.ts` fails if one comes back.
# Measured 2026-08-16: 440 runs in seven days, 209 of them push and 227 pull_request, so roughly half
# of every run this repository made was a second look at code that had already passed.
#
# It used to be stated as a MONEY cost, and that half was wrong. This header claimed those 209 push
# runs were spending about 1,890 billed minutes a month against the 2,000 a PRIVATE repo gets on a
# free personal plan, and that crossing it would STOP CI rather than bill for it. The repository is
# PUBLIC (`gh repo view --json visibility` answers PUBLIC, checked 2026-08-29), and GitHub does not
# bill a public repository for standard hosted runners, so no run here has ever cost money.
#
# What it does NOT mean is that a duplicate run is free, and saying so would be the same mistake
# pointing the other way (L307). On a free public repository the budget is the RUNNER CONCURRENCY
# LIMIT: a job is priced in the slots it holds times how long it holds them, whoever is waiting, and
# every job launched over the limit delays every other. So dropping half the runs is worth more here
# than the old paragraph claimed, not less, and the currency is queue time rather than dollars.
# Corrected rather than deleted because the wrong version was load bearing in the direction that
# matters: it told anybody weighing a new job that there was no room for one, and it read as a
# measurement (#3233, L32).
#
# What removing the push trigger costs, and why that cost is already paid elsewhere. A pull request run proves the
# branch works beside the code it was CUT FROM, never beside what landed since, and the push run on
# main was the backstop for that. The local merge scripts make a STRONGER version of the same check:
# `verify-and-merge-branch.sh` and `verify-and-merge-batch.sh` both merge current `origin/main` into
# the branch and run the FULL suite (Swift included, which this job cannot) before anything merges,
# and going through one of them is mandatory. So the backstop is kept and the duplicate is dropped,
# because it is duplicated work rather than because it is unaffordable.
#
# Note also that a push to main can only ever BE a merge: `scripts/hooks/pre-push` refuses a push
# whose destination is main, so nothing else could have triggered this job.
#
# A paths filter was considered instead and REJECTED as unsafe. This job looks like it only covers
# the TypeScript importer, but its tests read `docs/prep-runbook.md`,
# `docs/scout-extract-runbook.md`, `AGENTS.md`, `package.json` and `fixtures/scout-extract-corpus/`,
# and `src/lib/docsCommands.test.ts` asserts that every path AGENTS.md mentions still EXISTS. So
# renaming any script anywhere in the tree can turn this job red, its real input set is the whole
# repository, and a filter would make it skip precisely the change that breaks it. A skipped job is
# indistinguishable from a passing one (L88).

# THE SWIFT TESTS RUN HERE AGAIN, on a GitHub-hosted macOS runner, and the paragraph this replaces
# was wrong about why they could not.
#
# #1347 retired a SELF-HOSTED runner on Dan's Mac (the `swift-tests` job on a
# `[self-hosted, macOS, overture-mac]` label), which repeatedly went offline mid-job and forced
# admin-merges. That was the right call about that runner. But the issue offered two ways out,
# "(a) retiring swift-tests and relying on the local pre-push test gate ... or (b) moving Swift tests
# onto a GitHub-hosted macOS runner", and (a) was taken with no reason recorded anywhere for
# rejecting (b). For seven weeks the only verification the Mac app had was a local run on the word of
# whoever ran it, on a repository whose own CI header says of the merge scripts "(Swift included,
# which this job cannot)".
#
# It costs nothing. This repository is PUBLIC, and GitHub's billing documentation says "The use of
# standard GitHub-hosted runners is free: In public repositories". `macos-26` is the standard arm64
# image and is generally available; it matches the Mac this app is written on (macOS 26.6, Xcode
# 26.6). The `-large` and `-xlarge` variants ARE billed even on a public repository and are
# deliberately not used.
#
# What it does cost is a runner SLOT, which is the real budget here (L307), so the job carries a
# timeout and `ciWorkflow.test.ts` fails if any job loses one.
#
# WHAT THIS DOES NOT REPLACE. A pull request run proves the branch works beside the code it was cut
# from, never beside what landed since (L85). `verify-and-merge-branch.sh` and
# `verify-and-merge-batch.sh` still merge current `origin/main` into the branch and run the whole
# suite before anything merges, and going through one of them is still mandatory. This job is the
# INDEPENDENT check that the local run actually happened and actually passed, which nothing provided
# before.
jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

  # The name is load bearing: a branch ruleset keys on it and cannot be found by searching this repo
  # (L305). It is deliberately the same `swift-tests` the self-hosted job used, so any ruleset written
  # against the old one starts being satisfied again rather than silently naming nothing.
  swift-tests:
    runs-on: macos-26
    timeout-minutes: 60

    env:
      # The app runs in exactly one timezone: Dan's. Making the runner match PRODUCTION is the point,
      # not a way of dodging a red.
      #
      # Measured on this job's first run, which is what it was for. 18 tests failed on a UTC runner and
      # the dominant cause was the clock, not the code: `BackupLogHonestyTests` expected a backup folder
      # named `20231114-171320` and got `20231114-221320`, exactly five hours apart, and the calendar
      # feed tests compare dates that fall at `04:00:00 +0000`, which is midnight Eastern. The suite has
      # never been run outside America/New_York, so a slice of it silently asserts local time behaviour
      # (L504, L39).
      #
      # Setting it here does NOT fix that, and #3834 is filed for the tests that should set their
      # own. What this line buys is that this job reports on the app rather than rediscovering the
      # suite's timezone coupling on every run, which is noise that would teach everyone to skip it.
      TZ: America/New_York

    steps:
      - uses: actions/checkout@v4

      # The committed project file is GENERATED from mac/project.yml, and regenerating it here rather
      # than trusting the checked-in copy means this job cannot be made green by a stale one.
      # `scripts/check-pbxproj-fresh.sh` is the guard that they agree; this is the run that proves the
      # generator works on a machine that is not Dan's.
      - name: Install the toolchain this repo builds with
        run: brew install xcodegen flock

      - name: Generate the Xcode project
        working-directory: mac
        run: xcodegen generate

      # Ad-hoc signing. A hosted runner has no developer identity in its keychain, and the test host is
      # a real app bundle that xcodebuild has to sign before it can launch it. Signing is not what this
      # job is testing, and `run-tests-locked.sh` passes trailing arguments straight through to
      # xcodebuild, so the settings go on the end rather than into the script.
      - name: Run the Mac suite
        run: mac/scripts/run-tests-locked.sh CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES

      # The runner's own account of what happened, kept whether the suite passed or failed: a red run
      # whose log has scrolled past is the one worth having the artifact for.
      - name: Keep the run's diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-test-diagnostics
          path: ~/.overture-mac-test-diagnostics
          if-no-files-found: ignore
          retention-days: 7
