name: Overture
options:
  bundleIdPrefix: com.danwright
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  Overture:
    type: application
    platform: macOS
    sources:
      - path: Overture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Overture/Info.plist
        # Release keeps the canonical identity (the resident /Applications copy); Debug carries a
        # .debug suffix so an Xcode dev run is a distinct app to macOS — its own TCC grants and its
        # own data directory (StoreLocation), so it can never collide with the resident copy (#267).
        PRODUCT_BUNDLE_IDENTIFIER: com.danwright.overture
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.danwright.overture.debug
  OvertureTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OvertureTests
    dependencies:
      - target: Overture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.danwright.overture.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Overture.app/Contents/MacOS/Overture"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Overture:
    build:
      targets:
        Overture: all
        OvertureTests: [test]
    test:
      targets:
        - OvertureTests
