name: Overture
options:
  bundleIdPrefix: com.danwright
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  # #470: SwiftUI view-state tests (does this render a Retry button, what text is showing)
  # instead of only being checkable by eye. Test-only dependency, not linked into Overture itself.
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: "0.10.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  Overture:
    type: application
    platform: macOS
    sources:
      - path: Overture
    dependencies:
      # #663: StoreSchemaGuard reads the store's raw sqlite_master to confirm it's actually
      # Overture's own database before ModelContainer ever opens it.
      - sdk: libsqlite3.tbd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Overture/Info.plist
        # Release keeps the canonical identity (the resident /Applications copy); Debug carries a
        # .debug suffix so an Xcode dev run is a distinct app to macOS — its own TCC grants and its
        # own data directory (StoreLocation), so it can never collide with the resident copy (#267).
        PRODUCT_BUNDLE_IDENTIFIER: com.danwright.overture
        # #568: same reasoning as PRODUCT_BUNDLE_IDENTIFIER above. Debug needs its own URL scheme so
        # LaunchServices can't route an `overture://` open() to the wrong build. Read into
        # OvertureDeepLink.scheme and Info.plist's CFBundleURLTypes.
        OVERTURE_URL_SCHEME: overture
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.danwright.overture.debug
          OVERTURE_URL_SCHEME: overture-debug
  # #1967: the PURE suite, and it is UNHOSTED on purpose.
  #
  # Every Swift test used to run inside the launched app (TEST_HOST/BUNDLE_LOADER), so any fault that
  # stopped the app staying open took all of them at once. On 2026-08-01 a crowded menu bar did exactly
  # that and nothing in the Mac app could be verified at all, reported by xcodebuild only as a runner
  # that "exited with code 0 while preparing to run tests". Since #1347 this local run is the ONLY
  # verification a Swift change ever gets, so one launch fault cannot be allowed to cost the whole suite.
  #
  # It reaches the app's code by COMPILING IT IN rather than by linking a host, which is why there is no
  # TEST_HOST here and no dependency on the Overture target. That keeps every declaration at its existing
  # visibility (one module, `internal` still reaches), so this target costs no access-control churn
  # across the 255 domain files and introduces no public API surface to maintain. The trade is that those
  # sources compile a second time.
  #
  # OvertureApp.swift is the ONE file it cannot take, because it carries `@main`. Nothing outside it
  # references the OvertureApp type (only comments do), and AppEnvironment was lifted into its own file
  # so the pure code that needs it is not dragged behind the entry point.
  OvertureTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OvertureTests
      # #1967: helpers both suites use. Their own directory rather than a copy in each, so a guard
      # helper cannot drift between the two targets that assert with it.
      - path: TestSupport
      - path: Overture
        excludes:
          - "App/OvertureApp.swift"
          - "Info.plist"
    dependencies:
      # #663: StoreSchemaGuard reads the store's raw sqlite_master. Compiled in here, so this target
      # needs the same library the app target does.
      - sdk: libsqlite3.tbd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.danwright.overture.tests

  # #1967: the handful that genuinely need a running app, and only those.
  #
  # ViewInspector renders a real SwiftUI view, which needs the host process, so these keep TEST_HOST and
  # keep paying the launch risk. That is the point of the split: a launch fault now costs these 17 files
  # instead of all 552, and the pure suite above still reports.
  OvertureHostedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OvertureHostedTests
      - path: TestSupport
    dependencies:
      - target: Overture
      - package: ViewInspector
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.danwright.overture.hostedtests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Overture.app/Contents/MacOS/Overture"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Overture:
    build:
      targets:
        Overture: all
        OvertureTests: [test]
        OvertureHostedTests: [test]
    test:
      targets:
        - OvertureTests
        - OvertureHostedTests
